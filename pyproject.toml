[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grey-resolve"
version = "0.1.0.dev0"
description = "Multimodal entity resolution for degraded, uncurated media (research prototype)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chris Schmidt" }]
keywords = ["face-embeddings", "vector-search", "entity-resolution", "fiqa"]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
index = ["faiss-cpu>=1.8"]
backbone = ["insightface>=1.3", "onnxruntime>=1.17", "opencv-python-headless>=4.9"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]
figures = ["matplotlib>=3.8"]
qdrant = ["qdrant-client>=1.9"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
